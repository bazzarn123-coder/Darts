<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Darts Deluxe Mobile & Desktop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --felt-color: #1b4d3e;
            --felt-gradient: radial-gradient(circle at center, #246552 0%, #113328 100%);
            --board-padding: 8px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--felt-gradient);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f2b22 0%, #05130f 100%);
            z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; transition: opacity 0.4s ease; overflow-y: auto;
        }
        #splash-screen.hidden { opacity: 0; pointer-events: none; }

        .splash-title {
            font-size: 2.2rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 4px;
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); text-align: center;
        }
        .splash-subtitle { font-size: 0.9rem; color: #a3c1ad; margin-bottom: 20px; text-align: center; }

        .settings-card {
            background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px; padding: 14px 18px; width: 100%; max-width: 360px;
            margin-bottom: 14px; backdrop-filter: blur(10px);
        }
        .settings-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #ffd700; margin-bottom: 8px; font-weight: 600; display: flex; justify-content: space-between;}

        .name-input {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem;
            outline: none; box-sizing: border-box; text-align: center; font-weight: 600;
        }
        .name-input:focus { border-color: #ffd700; }

        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

        .option-btn {
            background: rgba(0, 0, 0, 0.3); border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 9px 4px; border-radius: 10px; font-size: 0.75rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .option-btn.selected {
            background: #ffd700; border-color: #ffd700; color: #113328;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        #online-controls {
            margin-top: 10px; display: none; flex-direction: column; gap: 8px;
        }
        #online-controls.active { display: flex; }

        .start-btn {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); color: #113328;
            border: none; width: 100%; max-width: 360px; padding: 14px; border-radius: 12px;
            font-size: 1.05rem; font-weight: 800; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.4); margin-top: 10px;
        }
        .secondary-btn {
            background: rgba(255, 255, 255, 0.15); color: #fff;
            box-shadow: none; margin-top: 10px;
        }

        /* HEADER */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 14px; background: rgba(0, 0, 0, 0.25); backdrop-filter: blur(5px);
            font-size: 0.85rem; font-weight: 600; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; color: #a3c1ad; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.15); border: none; color: #fff;
            width: 32px; height: 32px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-size: 0.95rem; cursor: pointer;
        }

        /* GAME BOARD & SCOREBOARD */
        #game-board {
            flex: 1; position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; padding: var(--board-padding);
        }

        .scoreboard-container {
            display: flex; width: 100%; max-width: 420px; justify-content: space-around;
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; padding: 8px; backdrop-filter: blur(5px); gap: 6px;
        }
        .player-card {
            display: flex; flex-direction: column; align-items: center; flex: 1;
            padding: 6px; border-radius: 8px; transition: all 0.3s;
        }
        .player-card.active {
            background: rgba(255, 215, 0, 0.2); border: 1px solid #ffd700;
        }
        .p-name { font-size: 0.75rem; text-transform: uppercase; color: #a3c1ad; font-weight: 700; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        .p-score { font-size: 1.8rem; font-weight: 900; color: #ffd700; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .dart-indicators { display: flex; gap: 4px; margin-top: 2px; }
        .dart-icon { font-size: 0.8rem; opacity: 0.2; }
        .dart-icon.active { opacity: 1; }

        /* THREE-DART OUT HELPER */
        .checkout-helper {
            font-size: 0.65rem;
            font-weight: 700;
            color: #ffd700;
            margin-top: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            min-height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        /* FIXED RESPONSIVE BOARD WRAPPER - PREVENTS OBLONG STRETCHING */
        .dartboard-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: min(88vw, 48vh);
            height: min(88vw, 48vh);
            margin: auto;
            aspect-ratio: 1 / 1;
        }
        #dartboard-canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: pointer;
            display: block;
        }

        .turn-status {
            background: rgba(0,0,0,0.4); border-radius: 20px; padding: 6px 16px;
            font-size: 0.85rem; font-weight: bold; color: #a3c1ad; border: 1px solid rgba(255,255,255,0.1);
        }

        /* DESKTOP & LARGE SCREEN ENHANCEMENTS */
        @media (min-width: 768px), (min-height: 700px) and (min-width: 600px) {
            header { padding: 12px 24px; font-size: 1rem; }
            .stat-label { font-size: 0.7rem; }
            .icon-btn { width: 38px; height: 38px; font-size: 1.1rem; }

            .splash-title { font-size: 3rem; }
            .settings-card { max-width: 440px; padding: 18px 22px; }
            .start-btn { max-width: 440px; font-size: 1.15rem; padding: 16px; }

            .scoreboard-container { max-width: 620px; padding: 12px 18px; gap: 12px; border-radius: 16px; }
            .p-name { font-size: 0.95rem; }
            .p-score { font-size: 2.6rem; }
            .dart-icon { font-size: 1.1rem; }
            .checkout-helper { font-size: 0.85rem; min-height: 24px; padding: 4px 10px; }

            .dartboard-wrapper { 
                width: min(80vw, 55vh, 600px);
                height: min(80vw, 55vh, 600px);
            }
            .turn-status { font-size: 1.1rem; padding: 10px 24px; }

            #online-chat-container { max-width: 620px; padding: 8px 14px; }
            #chat-messages { font-size: 0.85rem; height: 22px; }
            #chat-input-field { font-size: 0.85rem; padding: 8px 12px; }
            .option-btn { font-size: 0.85rem; padding: 11px 6px; }
        }

        /* WIN OVERLAY */
        #win-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #win-overlay.show { opacity: 1; pointer-events: auto; }
        .win-card {
            background: #113328; border: 2px solid #ffd700; padding: 24px; border-radius: 16px;
            text-align: center; box-shadow: 0 10px 30px rgba(255,215,0,0.3); width: 85%; max-width: 360px;
        }
        
        .toggle-switch { display: flex; align-items: center; font-size: 0.8rem; cursor: pointer; color: #a3c1ad; }
        .toggle-switch input { margin-right: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="splash-screen">
        <div class="splash-title">DARTS</div>
        <div class="splash-subtitle">Mobile Deluxe</div>

        <!-- PLAYER NAME ENTRY -->
        <div class="settings-card">
            <div class="settings-label">Your Name</div>
            <input type="text" id="player-name-input" class="name-input" value="Player 1" maxlength="12" placeholder="Enter Name">
        </div>

        <div class="settings-card">
            <div class="settings-label">
                Game Mode
                <label class="toggle-switch"><input type="checkbox" id="sound-toggle" checked> Sound</label>
            </div>
            <div class="options-grid" id="mode-options">
                <button class="option-btn selected" data-mode="1p">1 Player vs AI</button>
                <button class="option-btn" data-mode="2p">2P Local</button>
                <button class="option-btn" data-mode="online">2P Online</button>
            </div>

            <!-- ONLINE CONTROLS -->
            <div id="online-controls">
                <input type="text" id="peer-id-input" class="name-input" placeholder="Enter Friend's Code (e.g. J.Piers)" style="font-size: 0.8rem;">
                <div style="font-size: 0.7rem; color: #a3c1ad; text-align: center;">Leave blank to host a room, or type a code to join.</div>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-label">Target Score</div>
            <div class="options-grid" id="score-options" style="grid-template-columns: repeat(2, 1fr);">
                <button class="option-btn selected" data-target="301">301</button>
                <button class="option-btn" data-target="501">501</button>
            </div>
        </div>

        <button class="start-btn" id="start-game-btn">START GAME</button>
    </div>

    <header>
        <button class="icon-btn" id="menu-btn" title="Menu">🏠</button>
        <div class="stat-item"><span class="stat-label">Time</span><span id="timer-val">00:00</span></div>
        <div class="stat-item"><span class="stat-label">Turn Hit</span><span id="turn-score-val">0</span></div>
        <button class="icon-btn" id="restart-btn" title="Restart">🔄</button>
    </header>

    <div id="game-board">
        <div class="scoreboard-container">
            <div class="player-card active" id="p1-card">
                <div class="p-name" id="p1-name">PLAYER 1</div>
                <div class="p-score" id="p1-score">301</div>
                <div class="dart-indicators" id="p1-darts">
                    <span class="dart-icon active">🎯</span>
                    <span class="dart-icon active">🎯</span>
                    <span class="dart-icon active">🎯</span>
                </div>
                <div class="checkout-helper" id="p1-checkout">OUT: —</div>
            </div>
            <div class="player-card" id="p2-card">
                <div class="p-name" id="p2-name">AI</div>
                <div class="p-score" id="p2-score">301</div>
                <div class="dart-indicators" id="p2-darts">
                    <span class="dart-icon">🎯</span>
                    <span class="dart-icon">🎯</span>
                    <span class="dart-icon">🎯</span>
                </div>
                <div class="checkout-helper" id="p2-checkout">OUT: —</div>
            </div>
        </div>

        <!-- ONLINE CHAT WIDGET -->
        <div id="online-chat-container" style="display: none; width: 100%; max-width: 420px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; padding: 6px 10px; margin: 4px 0; backdrop-filter: blur(5px);">
            <div id="chat-messages" style="font-size: 0.75rem; color: #a3c1ad; height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px;">Chat: Connected</div>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="chat-input-field" class="name-input" placeholder="Send a message..." maxlength="80" style="padding: 6px 10px; font-size: 0.8rem; text-align: left; flex: 1;">
                <button class="option-btn" id="chat-send-btn" style="padding: 6px 14px; font-size: 0.8rem; width: auto; background: #ffd700; color: #113328; border-color: #ffd700;">Send</button>
            </div>
        </div>

        <div class="dartboard-wrapper">
            <canvas id="dartboard-canvas" width="600" height="600"></canvas>
        </div>

        <div class="turn-status" id="turn-status-text">Tap to lock horizontal aim!</div>
    </div>

    <div id="win-overlay">
        <div class="win-card">
            <h2 style="color: #ffd700; margin-bottom: 8px; font-size: 1.6rem;" id="win-title">🎉 YOU WON! 🎉</h2>
            <p id="win-stats" style="margin-bottom: 16px; color: #a3c1ad; font-size: 0.9rem;"></p>
            <button class="start-btn" id="play-again-btn">PLAY AGAIN</button>
            <button class="start-btn secondary-btn" id="win-menu-btn">MAIN MENU</button>
        </div>
    </div>

    <script>
        const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
        
        let gameState = {
            mode: '1p',
            p1Name: 'Player 1',
            p2Name: 'AI',
            targetScore: 301,
            soundEnabled: true,
            activePlayer: 1,
            myPlayerNum: 1,
            scores: { 1: 301, 2: 301 },
            turnStartScores: { 1: 301, 2: 301 },
            dartsLeft: 3,
            turnScore: 0,
            time: 0,
            timerInterval: null,
            thrownDarts: [],
            isAnimating: false,
            won: false
        };

        // Aiming sway state
        let aimState = {
            phase: 'x',
            lockedX: null,
            lockedY: null,
            angle: 0,
            speed: 0.05
        };

        // PeerJS Online State
        let peer = null;
        let peerConn = null;

        let animFrameId = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!gameState.soundEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'bust') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.15);
                osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        // STRICT DOUBLE-OUT 3-DART CHECKOUT CALCULATOR
        function getCheckout(score) {
            if (score > 170 || score <= 1) return null;
            
            const bogeys = [169, 168, 166, 165, 163, 162, 159];
            if (bogeys.includes(score)) return null;

            const classics = {
                170: 'T20 • T20 • Bull',
                167: 'T20 • T19 • Bull',
                164: 'T20 • T19 • D17',
                161: 'T20 • T17 • Bull',
                160: 'T20 • T20 • D20',
                157: 'T20 • T19 • D20',
                156: 'T20 • T20 • D18',
                154: 'T20 • T18 • D20',
                153: 'T20 • T19 • D18',
                152: 'T20 • T20 • D16',
                151: 'T20 • T17 • D20',
                150: 'T20 • T20 • D15',
                140: 'T20 • T20 • D10',
                130: 'T20 • T20 • D5',
                120: 'T20 • 20 • D20',
                100: 'T20 • D20',
                90: 'T20 • D15',
                80: 'T16 • D16',
                70: 'T10 • D20',
                60: '20 • D20',
                50: 'Bull',
                40: 'D20',
                36: 'D18',
                32: 'D16',
                24: 'D12',
                20: 'D10',
                16: 'D8',
                10: 'D5',
                8: 'D4',
                4: 'D2',
                2: 'D1'
            };
            if (classics[score]) return classics[score];

            const setupTargets = [];
            for (let i = 20; i >= 1; i--) setupTargets.push({ name: 'T' + i, val: i * 3 });
            setupTargets.push({ name: 'Bull', val: 50 });
            for (let i = 20; i >= 1; i--) setupTargets.push({ name: 'D' + i, val: i * 2 });
            setupTargets.push({ name: '25', val: 25 });
            for (let i = 20; i >= 1; i--) setupTargets.push({ name: 'S' + i, val: i });

            const finishTargets = [];
            for (let i = 20; i >= 1; i--) finishTargets.push({ name: 'D' + i, val: i * 2 });
            finishTargets.push({ name: 'Bull', val: 50 });

            for (let f of finishTargets) {
                if (f.val === score) return f.name;
            }

            for (let s1 of setupTargets) {
                for (let f of finishTargets) {
                    if (s1.val + f.val === score) return `${s1.name} • ${f.name}`;
                }
            }

            for (let s1 of setupTargets) {
                for (let s2 of setupTargets) {
                    for (let f of finishTargets) {
                        if (s1.val + s2.val + f.val === score) return `${s1.name} • ${s2.name} • ${f.name}`;
                    }
                }
            }

            return null;
        }

        const canvas = document.getElementById('dartboard-canvas');
        const ctx = canvas.getContext('2d');

        document.querySelectorAll('#mode-options .option-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#mode-options .option-btn').forEach(b => b.classList.remove('selected'));
                e.currentTarget.classList.add('selected');
                gameState.mode = e.currentTarget.dataset.mode;

                const onlineControls = document.getElementById('online-controls');
                if (gameState.mode === 'online') {
                    onlineControls.classList.add('active');
                } else {
                    onlineControls.classList.remove('active');
                }
            });
        });

        document.querySelectorAll('#score-options .option-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#score-options .option-btn').forEach(b => b.classList.remove('selected'));
                e.currentTarget.classList.add('selected');
                gameState.targetScore = parseInt(e.currentTarget.dataset.target);
            });
        });

        document.getElementById('sound-toggle').addEventListener('change', (e) => { gameState.soundEnabled = e.target.checked; });
        document.getElementById('start-game-btn').addEventListener('click', handleStartBtn);
        document.getElementById('play-again-btn').addEventListener('click', startGame);
        document.getElementById('win-menu-btn').addEventListener('click', () => {
            document.getElementById('win-overlay').classList.remove('show');
            document.getElementById('splash-screen').classList.remove('hidden');
        });
        document.getElementById('menu-btn').addEventListener('click', () => {
            clearInterval(gameState.timerInterval);
            document.getElementById('splash-screen').classList.remove('hidden');
        });
        document.getElementById('restart-btn').addEventListener('click', startGame);

        // Chat Listeners
        document.getElementById('chat-send-btn').addEventListener('click', sendChatMessage);
        document.getElementById('chat-input-field').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        function sendChatMessage() {
            const inputField = document.getElementById('chat-input-field');
            const text = inputField.value.trim();
            if (!text || !peerConn) return;

            peerConn.send({ type: 'CHAT', text: text });
            const myName = gameState.myPlayerNum === 1 ? gameState.p1Name : gameState.p2Name;
            document.getElementById('chat-messages').innerText = `${myName} (You): ${text}`;
            inputField.value = '';
        }

        canvas.addEventListener('click', () => {
            if (gameState.won || gameState.isAnimating) return;
            
            if (gameState.mode === '1p' && gameState.activePlayer === 2) return;
            if (gameState.mode === 'online' && gameState.activePlayer !== gameState.myPlayerNum) return;

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const range = 250;

            if (aimState.phase === 'x') {
                aimState.lockedX = cx + Math.sin(aimState.angle) * range;
                aimState.phase = 'y';
                aimState.angle = 0;
            } else if (aimState.phase === 'y') {
                aimState.lockedY = cy + Math.sin(aimState.angle) * range;
                aimState.phase = 'idle';

                if (gameState.mode === 'online' && peerConn) {
                    peerConn.send({ type: 'THROW', x: aimState.lockedX, y: aimState.lockedY });
                }

                throwDart(aimState.lockedX, aimState.lockedY);
            }
        });

        function handleStartBtn() {
            const nameInput = document.getElementById('player-name-input').value.trim();
            gameState.p1Name = nameInput || 'Player 1';

            if (gameState.mode === 'online') {
                initOnlineGame();
            } else {
                gameState.myPlayerNum = 1;
                gameState.p2Name = gameState.mode === '1p' ? 'AI' : 'Player 2';
                startGame();
            }
        }

        function initOnlineGame() {
            const friendCode = document.getElementById('peer-id-input').value.trim();

            if (friendCode) {
                gameState.myPlayerNum = 2;
                gameState.p2Name = gameState.p1Name;
                peer = new Peer();
                peer.on('open', () => {
                    peerConn = peer.connect(friendCode);
                    setupPeerEvents();
                });
            } else {
                gameState.myPlayerNum = 1;
                const hostCode = 'darts-' + Math.floor(1000 + Math.random() * 9000);
                peer = new Peer(hostCode);
                
                document.getElementById('peer-id-input').value = hostCode;
                alert(`Hosting! Share Code: ${hostCode} with your friend.`);

                peer.on('open', () => {
                    peer.on('connection', (conn) => {
                        peerConn = conn;
                        setupPeerEvents();
                    });
                });
            }
        }

        function setupPeerEvents() {
            peerConn.on('open', () => {
                peerConn.send({ type: 'INIT', name: gameState.p1Name, target: gameState.targetScore });
            });

            peerConn.on('data', (data) => {
                if (data.type === 'INIT') {
                    if (gameState.myPlayerNum === 1) {
                        gameState.p2Name = data.name;
                        peerConn.send({ type: 'INIT_ACK', name: gameState.p1Name });
                    } else {
                        gameState.p1Name = data.name;
                    }
                    startGame();
                } else if (data.type === 'INIT_ACK') {
                    gameState.p1Name = data.name;
                    startGame();
                } else if (data.type === 'THROW') {
                    throwDart(data.x, data.y);
                } else if (data.type === 'CHAT') {
                    const senderName = gameState.myPlayerNum === 1 ? gameState.p2Name : gameState.p1Name;
                    document.getElementById('chat-messages').innerText = `${senderName}: ${data.text}`;
                }
            });
        }

        function startGame() {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('win-overlay').classList.remove('show');
            
            gameState.won = false;
            gameState.activePlayer = 1;
            gameState.scores[1] = gameState.targetScore;
            gameState.scores[2] = gameState.targetScore;
            gameState.turnStartScores[1] = gameState.targetScore;
            gameState.turnStartScores[2] = gameState.targetScore;
            gameState.dartsLeft = 3;
            gameState.turnScore = 0;
            gameState.thrownDarts = [];
            gameState.time = 0;

            aimState.phase = 'x';
            aimState.angle = 0;

            document.getElementById('p1-name').innerText = gameState.p1Name;
            document.getElementById('p2-name').innerText = gameState.p2Name;
            document.getElementById('p1-score').innerText = gameState.targetScore;
            document.getElementById('p2-score').innerText = gameState.targetScore;

            const chatContainer = document.getElementById('online-chat-container');
            if (gameState.mode === 'online') {
                chatContainer.style.display = 'block';
                document.getElementById('chat-messages').innerText = 'Chat connected. Say hello!';
            } else {
                chatContainer.style.display = 'none';
            }

            updateUI();
            startTimer();
            startAimingLoop();
        }

        function startTimer() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                if (gameState.won) return;
                gameState.time++;
                let mins = Math.floor(gameState.time / 60).toString().padStart(2, '0');
                let secs = (gameState.time % 60).toString().padStart(2, '0');
                document.getElementById('timer-val').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function startAimingLoop() {
            if (animFrameId) cancelAnimationFrame(animFrameId);

            function loop() {
                if (!gameState.won) {
                    if (aimState.phase === 'x' || aimState.phase === 'y') {
                        aimState.angle += aimState.speed;
                    }
                    drawBoard();
                }
                animFrameId = requestAnimationFrame(loop);
            }
            loop();
        }

        function drawBoard() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = 266;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Outer catch ring
            ctx.beginPath(); ctx.arc(cx, cy, radius + 24, 0, Math.PI * 2);
            ctx.fillStyle = '#0d0d0d'; ctx.fill();

            const rDoubleOut = radius;
            const rDoubleIn = radius - 20;
            const rTripleOut = radius - 99;
            const rTripleIn = radius - 119;
            const rOuterBull = 25;
            const rInnerBull = 10;

            const angleStep = (Math.PI * 2) / 20;
            const startAngleOffset = -Math.PI / 2 - (angleStep / 2);

            for (let i = 0; i < 20; i++) {
                const a1 = startAngleOffset + (i * angleStep);
                const a2 = a1 + angleStep;
                const isEven = i % 2 === 0;

                drawSegment(cx, cy, rDoubleIn, rTripleOut, a1, a2, isEven ? '#111' : '#e0d6b8');
                drawSegment(cx, cy, rTripleOut, rTripleIn, a1, a2, isEven ? '#d32f2f' : '#2e7d32');
                drawSegment(cx, cy, rTripleIn, rOuterBull, a1, a2, isEven ? '#111' : '#e0d6b8');
                drawSegment(cx, cy, rDoubleOut, rDoubleIn, a1, a2, isEven ? '#d32f2f' : '#2e7d32');

                const numAngle = a1 + angleStep / 2;
                const numX = cx + (radius + 14) * Math.cos(numAngle);
                const numY = cy + (radius + 14) * Math.sin(numAngle);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(SECTORS[i].toString(), numX, numY);
            }

            // Bulls
            ctx.beginPath(); ctx.arc(cx, cy, rOuterBull, 0, Math.PI * 2);
            ctx.fillStyle = '#2e7d32'; ctx.fill();
            ctx.beginPath(); ctx.arc(cx, cy, rInnerBull, 0, Math.PI * 2);
            ctx.fillStyle = '#d32f2f'; ctx.fill();

            // Render Thrown Darts
            gameState.thrownDarts.forEach(d => {
                ctx.beginPath(); ctx.arc(d.x, d.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = d.p === 1 ? '#ffd700' : '#00e5ff'; ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
            });

            // Draw Aiming Oscillators
            const isMyTurn = (gameState.mode === '1p' && gameState.activePlayer === 1) || 
                             (gameState.mode === '2p') || 
                             (gameState.mode === 'online' && gameState.activePlayer === gameState.myPlayerNum);

            if (!gameState.isAnimating && isMyTurn) {
                const range = 250;
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
                ctx.lineWidth = 3;

                if (aimState.phase === 'x') {
                    const currentX = cx + Math.sin(aimState.angle) * range;
                    ctx.beginPath(); ctx.moveTo(currentX, cy - range); ctx.lineTo(currentX, cy + range); ctx.stroke();
                } else if (aimState.phase === 'y') {
                    const currentY = cy + Math.sin(aimState.angle) * range;
                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
                    ctx.beginPath(); ctx.moveTo(aimState.lockedX, cy - range); ctx.lineTo(aimState.lockedX, cy + range); ctx.stroke();

                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
                    ctx.beginPath(); ctx.moveTo(cx - range, currentY); ctx.lineTo(cx + range, currentY); ctx.stroke();

                    ctx.beginPath(); ctx.arc(aimState.lockedX, currentY, 9, 0, Math.PI * 2); ctx.fillStyle = '#ffd700'; ctx.fill();
                }
            }
        }

        function drawSegment(cx, cy, rOut, rIn, a1, a2, color) {
            ctx.beginPath();
            ctx.arc(cx, cy, rOut, a1, a2, false);
            ctx.arc(cx, cy, rIn, a2, a1, true);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function calculateHit(x, y) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const dx = x - cx;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist <= 10) return { score: 50, isDouble: true }; // Inner Bullseye = Double 25
            if (dist <= 25) return { score: 25, isDouble: false }; // Outer Bull
            if (dist > 266) return { score: 0, isDouble: false };

            let angle = Math.atan2(dy, dx) + (Math.PI / 2) + (Math.PI / 20);
            if (angle < 0) angle += Math.PI * 2;
            const sectorIdx = Math.floor((angle % (Math.PI * 2)) / (Math.PI / 10));
            const baseVal = SECTORS[sectorIdx];

            if (dist >= 246 && dist <= 266) return { score: baseVal * 2, isDouble: true };
            if (dist >= 147 && dist <= 167) return { score: baseVal * 3, isDouble: false };

            return { score: baseVal, isDouble: false };
        }

        function throwDart(x, y) {
            gameState.isAnimating = true;
            const hit = calculateHit(x, y);
            const score = hit.score;
            const isDouble = hit.isDouble;

            gameState.thrownDarts.push({ x, y, p: gameState.activePlayer });
            gameState.dartsLeft--;
            
            const currentP = gameState.activePlayer;
            const remainingScore = gameState.scores[currentP];
            const nextScore = remainingScore - score;

            // DOUBLE-OUT BUST RULE
            if (nextScore < 0 || nextScore === 1 || (nextScore === 0 && !isDouble)) {
                playSound('bust');
                gameState.scores[currentP] = gameState.turnStartScores[currentP];
                gameState.turnScore = 0;

                document.getElementById(`p${currentP}-score`).innerText = gameState.scores[currentP];
                document.getElementById('turn-score-val').innerText = '0';
                
                const activeName = currentP === 1 ? gameState.p1Name : gameState.p2Name;
                document.getElementById('turn-status-text').innerText = `💥 BUST! (${activeName})`;

                updateUI();

                setTimeout(() => {
                    gameState.isAnimating = false;
                    switchTurn();
                }, 1200);
                return;
            }

            playSound('hit');
            gameState.scores[currentP] = nextScore;
            gameState.turnScore += score;

            document.getElementById(`p${currentP}-score`).innerText = gameState.scores[currentP];
            document.getElementById('turn-score-val').innerText = gameState.turnScore;

            updateUI();

            if (gameState.scores[currentP] === 0 && isDouble) {
                gameState.won = true;
                playSound('win');
                const winnerName = currentP === 1 ? gameState.p1Name : gameState.p2Name;
                document.getElementById('win-title').innerText = `🎉 ${winnerName.toUpperCase()} WINS! 🎉`;
                document.getElementById('win-stats').innerText = `Finished in ${document.getElementById('timer-val').innerText}!`;
                document.getElementById('win-overlay').classList.add('show');
                gameState.isAnimating = false;
                return;
            }

            setTimeout(() => {
                gameState.isAnimating = false;
                if (gameState.dartsLeft === 0) {
                    switchTurn();
                } else {
                    aimState.phase = 'x';
                    aimState.angle = 0;
                    if (gameState.mode === '1p' && gameState.activePlayer === 2) {
                        triggerAITurn();
                    }
                }
            }, 400);
        }

        function switchTurn() {
            gameState.dartsLeft = 3;
            gameState.turnScore = 0;
            gameState.thrownDarts = [];
            gameState.activePlayer = gameState.activePlayer === 1 ? 2 : 1;
            gameState.turnStartScores[gameState.activePlayer] = gameState.scores[gameState.activePlayer];
            document.getElementById('turn-score-val').innerText = '0';
            
            aimState.phase = 'x';
            aimState.angle = 0;

            updateUI();

            if (gameState.mode === '1p' && gameState.activePlayer === 2) {
                triggerAITurn();
            }
        }

        function triggerAITurn() {
            if (gameState.won || gameState.activePlayer !== 2) return;
            document.getElementById('turn-status-text').innerText = "AI is aiming...";
            
            setTimeout(() => {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const scatter = 80;
                const x = cx + ((Math.random() - 0.5) * scatter);
                const y = cy + ((Math.random() - 0.5) * scatter);
                throwDart(x, y);
            }, 800);
        }

        function updateUI() {
            document.querySelectorAll('.player-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`p${gameState.activePlayer}-card`).classList.add('active');

            for (let p = 1; p <= 2; p++) {
                const icons = document.querySelectorAll(`#p${p}-darts .dart-icon`);
                icons.forEach((ic, idx) => {
                    if (p === gameState.activePlayer) {
                        ic.classList.toggle('active', idx < gameState.dartsLeft);
                    } else {
                        ic.classList.remove('active');
                    }
                });

                const checkout = getCheckout(gameState.scores[p]);
                const checkoutEl = document.getElementById(`p${p}-checkout`);
                if (checkoutEl) {
                    checkoutEl.innerText = checkout ? `OUT: ${checkout}` : `OUT: —`;
                    checkoutEl.style.opacity = (p === gameState.activePlayer && checkout) ? '1' : '0.5';
                }
            }

            const currentPName = gameState.activePlayer === 1 ? gameState.p1Name : gameState.p2Name;

            if (gameState.mode === '1p' && gameState.activePlayer === 2) {
                document.getElementById('turn-status-text').innerText = "AI Turn...";
            } else if (gameState.mode === 'online' && gameState.activePlayer !== gameState.myPlayerNum) {
                document.getElementById('turn-status-text').innerText = `Waiting for ${currentPName}...`;
            } else {
                if (aimState.phase === 'x') {
                    document.getElementById('turn-status-text').innerText = `${currentPName}: Tap for HORIZONTAL aim!`;
                } else if (aimState.phase === 'y') {
                    document.getElementById('turn-status-text').innerText = `${currentPName}: Tap for HEIGHT & throw!`;
                }
            }
        }
    </script>
</body>
